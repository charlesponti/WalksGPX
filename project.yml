name: WalksGPX
options:
  bundleIdPrefix: com.charlesponti
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 3QHJ2KN8AL
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.6.1
targets:
  WalksGPX iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    resources:
      - path: iOS/walking.json
    dependencies:
      - package: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ponti.walksgpx.ios
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/WalksGPX.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - WalksGPXTests
  WalksGPX macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ponti.walksgpx.macos
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/WalksGPX.entitlements
    scheme:
      testTargets: []
  WalksGPXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: WalksGPX iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ponti.walksgpx.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WalksGPX iOS.app/WalksGPX iOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
